[package]
name = "everscribe"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Rust SDK for the Everscribe audit-log API"
repository = "https://github.com/everscribe/sdk-rust"
readme = "README.md"
keywords = ["everscribe", "audit-log", "audit", "sdk"]
categories = ["api-bindings"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
thiserror = "1"

# Optional: the axum / tower middleware adapter, behind the `axum` feature.
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true }
http = { version = "1", optional = true }

[features]
axum = ["dep:axum", "dep:tower", "dep:http"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
wiremock = "0.6"
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
http = "1"
